<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Türkçe Duygu Analizi</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<main>
  <header>
    <h1>Türkçe Duygu Analizi</h1>
    <p class="sub">Model tamamen tarayıcınızda çalışır, yazdığınız metin hiçbir sunucuya gönderilmez.</p>
  </header>

  <section class="card">
    <div class="row">
      <label for="backend">Çalıştırma ortamı</label>
      <select id="backend">
        <option value="webgpu|fp32">WebGPU · fp32</option>
        <option value="wasm|q8" selected>WASM (CPU) · int8</option>
        <option value="wasm|fp32">WASM (CPU) · fp32</option>
      </select>
      <span id="status" class="muted">Model yükleniyor…</span>
    </div>

    <textarea id="text" rows="3" placeholder="Bir cümle yazın…">Kargo çok hızlı geldi, ürün harika!</textarea>
    <div class="row">
      <button id="analyze" disabled>Analiz et</button>
      <span id="latency" class="muted"></span>
    </div>

    <div id="result" class="bars"></div>
  </section>

  <section class="card">
    <h2>Hız karşılaştırması</h2>
    <p class="muted">Her ortamda modeli yükler, 5 kez ısınma turu atar, sonra aynı cümleyi 50 kez çalıştırıp ölçer.</p>
    <button id="bench">Karşılaştırmayı başlat</button>
    <table id="benchTable" hidden>
      <thead><tr><th>Ortam</th><th>Yükleme</th><th>İlk çalıştırma</th><th>Medyan</th><th>p95</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
